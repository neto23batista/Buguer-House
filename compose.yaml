x-app-environment: &app-environment
  APP_ENV: development
  APP_URL: ${APP_URL:-http://localhost:8080}
  DB_HOST: db
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-burger_house}
  DB_USER: ${DB_USER:-bh_web}
  DB_PASSWORD: ${DB_PASSWORD:-local-demo-change-me}
  DB_SSL_REQUIRED: "0"
  DB_CONNECT_TIMEOUT: ${DB_CONNECT_TIMEOUT:-5}
  DB_READ_TIMEOUT: ${DB_READ_TIMEOUT:-10}
  SESSION_DRIVER: mysql
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-43200}
  SESSION_COOKIE_SECURE: "0"
  ADMIN_USER: ${ADMIN_USER:-admin}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  OPERATOR_USER: ${OPERATOR_USER:-}
  OPERATOR_PASSWORD_HASH: ${OPERATOR_PASSWORD_HASH:-}
  STORE_PICKUP_ADDRESS: ${STORE_PICKUP_ADDRESS:-}
  STORE_CONTACT_PHONE: ${STORE_CONTACT_PHONE:-}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1/32 ::1/128}

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-burger_house}
      MYSQL_USER: ${DB_USER:-bh_web}
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-demo-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-change-me}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    environment: *app-environment
    command: ["php", "bin/migrate.php"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build: .
    environment: *app-environment
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  mysql-data:
